[package]
name = "mami-daycare-desktop"
version = "1.0.0"
description = "Mami Daycare desktop app"
authors = ["Mami"]
edition = "2021"

[lib]
name = "mami_daycare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
